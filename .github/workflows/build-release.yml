name: Build Vayora Signed Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q vayora-mdm-agent-android.zip
          test -f vayora-mdm-agent-android/app/build.gradle.kts

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Configure release signing
        env:
          KS: ${{ secrets.VAYORA_KEYSTORE_B64 }}
          KSP: ${{ secrets.VAYORA_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.VAYORA_KEY_ALIAS }}
          KP: ${{ secrets.VAYORA_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KS"
          test -n "$KSP"
          test -n "$KA"
          test -n "$KP"

          echo "$KS" | base64 -d > "$RUNNER_TEMP/vayora.jks"
          keytool -list -keystore "$RUNNER_TEMP/vayora.jks" \
            -storepass "$KSP" -alias "$KA"

          echo "KEYSTORE_PATH=$RUNNER_TEMP/vayora.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KSP" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KA" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KP" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build signed Release APK
        working-directory: vayora-mdm-agent-android
        run: |
          gradle --no-daemon assembleRelease
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: vayora-mdm-release-apk
          path: vayora-mdm-agent-android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
