name: Build Vayora Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP and fix signing
        run: |
          set -euo pipefail
          unzip -q vayora-mdm-agent-android.zip
          test -f vayora-mdm-agent-android/app/build.gradle.kts
          sed -i '/create("release") {/a\            storeType = "PKCS12"' vayora-mdm-agent-android/app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/34.0.0" >> "$GITHUB_PATH"
          test -x "$SDK/platform-tools/adb"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore and validate keystore
        env:
          KS: ${{ secrets.VAYORA_KEYSTORE_B64 }}
          PASS: ${{ secrets.VAYORA_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.VAYORA_KEY_ALIAS }}
          KPASS: ${{ secrets.VAYORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KS"
          test -n "$PASS"
          test -n "$ALIAS"
          test -n "$KPASS"

          printf '%s' "$KS" | base64 --decode > "$RUNNER_TEMP/vayora.p12"

          keytool -list \
            -keystore "$RUNNER_TEMP/vayora.p12" \
            -storetype PKCS12 \
            -storepass "$PASS" \
            -alias "$ALIAS"

          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/vayora.p12"
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$KPASS"
          } >> "$GITHUB_ENV"

      - name: Build signed Release APK
        working-directory: vayora-mdm-agent-android
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease

      - name: Verify signed APK
        run: |
          set -euo pipefail
          APK="vayora-mdm-agent-android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          apksigner verify --verbose "$APK"
          mkdir -p output
          cp "$APK" output/vayora-mdm-agent-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: vayora-mdm-agent-release
          path: output/vayora-mdm-agent-release.apk
          retention-days: 30
