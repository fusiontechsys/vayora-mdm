name: Generate release keystore (run once)

on:
  workflow_dispatch:
    inputs:
      password:
        description: "Store AND key password (16+ characters, no leading/trailing spaces)"
        required: true
        type: string

jobs:
  keystore:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate PKCS12 keystore and validate it
        env:
          PW: ${{ inputs.password }}
        run: |
          set -euo pipefail
          [ "${#PW}" -ge 16 ] || { echo "::error::Password must be at least 16 characters"; exit 1; }
          rm -f vayora-release.p12
          keytool -genkeypair -v -storetype PKCS12 -keystore vayora-release.p12 \
            -alias vayora -keyalg RSA -keysize 4096 -validity 9125 \
            -storepass:env PW -keypass:env PW \
            -dname "CN=Vayora MDM, O=Vayora"
          openssl asn1parse -inform DER -in vayora-release.p12 -i > asn1.txt
          sed -n '2p' asn1.txt > line2.txt
          grep -Eq 'INTEGER.*:03$' line2.txt || { echo "::error::PFX version is not 3"; exit 1; }
          keytool -list -v -storetype PKCS12 -keystore vayora-release.p12 -storepass:env PW -alias vayora > list.txt
          grep -q 'Entry type: PrivateKeyEntry' list.txt || { echo "::error::Alias vayora is not a private key"; exit 1; }
          base64 -w0 vayora-release.p12 > keystore-b64.txt
          echo "Generated PKCS12 PFX v3 keystore, alias vayora"

      - uses: actions/upload-artifact@v4
        with:
          name: vayora-release-keystore-DELETE-AFTER-SAVING
          path: keystore-b64.txt
          retention-days: 1
