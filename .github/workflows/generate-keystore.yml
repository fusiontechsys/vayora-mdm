
name: Generate release keystore (run once)

# Creates the permanent signing key for Vayora MDM Agent.
# Download and securely back up the artifact.
# Never regenerate this key for normal APK updates.

on:
  workflow_dispatch:
    inputs:
      password:
        description: "Aadith@12_Aadith@12"
        required: true
        type: string

jobs:
  keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Validate password
        env:
          PW: ${{ inputs.password }}
        run: |
          if [ "${#PW}" -lt 16 ]; then
            echo "Password must contain at least 16 characters."
            exit 1
          fi

      - name: Generate permanent signing keystore
        env:
          PW: ${{ inputs.password }}
        run: |
          set -euo pipefail

          keytool -genkeypair -v \
            -keystore vayora.jks \
            -alias vayora \
            -keyalg RSA \
            -keysize 4096 \
            -validity 9125 \
            -storepass "$PW" \
            -keypass "$PW" \
            -dname "CN=Vayora MDM, O=Vayora"

          base64 -w0 vayora.jks > keystore.b64

          cat > secrets-to-add.txt <<EOF
          VAYORA_KEYSTORE_B64 = Contents of keystore.b64
          VAYORA_KEYSTORE_PASSWORD = Your entered password
          VAYORA_KEY_ALIAS = vayora
          VAYORA_KEY_PASSWORD = Your entered password
          EOF

      - name: Upload keystore backup
        uses: actions/upload-artifact@v4
        with:
          name: vayora-keystore-DELETE-AFTER-SAVING
          path: |
            keystore.b64
            secrets-to-add.txt
          retention-days: 1
