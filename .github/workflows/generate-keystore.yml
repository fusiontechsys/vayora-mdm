
name: Generate Vayora Signing Key

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate permanent keystore
        env:
          PW: ${{ secrets.VAYORA_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$PW" ] || exit 1
          [ ${#PW} -ge 16 ] || exit 1

          keytool -genkeypair -v \
            -keystore vayora.jks \
            -alias vayora \
            -keyalg RSA \
            -keysize 4096 \
            -validity 9125 \
            -storepass "$PW" \
            -keypass "$PW" \
            -dname "CN=Vayora MDM, O=Vayora"

          base64 -w0 vayora.jks > keystore.b64

      - uses: actions/upload-artifact@v4
        with:
          name: vayora-signing-key
          path: keystore.b64
          retention-days: 1
