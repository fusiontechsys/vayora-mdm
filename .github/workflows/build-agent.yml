# Vayora MDM Agent - signed release APK.
# NOTE: keep this file name. The version code is github.run_number, which restarts from 1 if the
# workflow is renamed or recreated, and an upgrade with a lower version code is refused by Android.
name: Build Vayora MDM Agent APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.kts"
      - "gradle.properties"
      - ".github/workflows/build-agent.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Require and restore the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.VAYORA_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.VAYORA_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.VAYORA_KEY_ALIAS }}
          K_PASS: ${{ secrets.VAYORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ] || [ -z "$K_PASS" ]; then
            echo "::error::Release signing secrets are missing. Add VAYORA_KEYSTORE_B64, VAYORA_KEYSTORE_PASSWORD, VAYORA_KEY_ALIAS and VAYORA_KEY_PASSWORD. Refusing to build an unsigned or debug-signed MDM agent."
            exit 1
          fi
          KS_FILE="$RUNNER_TEMP/vayora-release.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$KS_FILE"
          # Verify the keystore opens with these credentials and contains the alias before building.
          keytool -list -keystore "$KS_FILE" -storepass "$KS_PASS" -alias "$KS_ALIAS" > /dev/null
          {
            echo "KEYSTORE_PATH=$KS_FILE"
            echo "KEYSTORE_PASSWORD=$KS_PASS"
            echo "KEY_ALIAS=$KS_ALIAS"
            echo "KEY_PASSWORD=$K_PASS"
          } >> "$GITHUB_ENV"
          echo "Release keystore loaded and verified."

      - name: Build signed release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain --stacktrace assembleRelease 2>&1 | tee build.log

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -f "$APK" || { echo "::error::Expected $APK was not produced"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signature.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" signature.txt || { echo "::error::APK is not v2-signed"; exit 1; }

      - name: Collect APK and checksums
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/vayora-mdm-agent.apk
          CERT=$(grep -m1 "certificate SHA-256 digest" signature.txt | sed 's/.*digest: //')
          {
            echo "## Vayora MDM Agent build #${{ github.run_number }} (signed release)"
            echo "Signing certificate SHA-256: \`$CERT\`"
            echo "Compare this certificate digest with the previous build before installing an update."
            echo "APK SHA-256: \`$(sha256sum out/vayora-mdm-agent.apk | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show build errors in the run summary
        if: failure()
        run: |
          {
            echo "## Build failed - key errors"
            echo '```'
            grep -E "^e: |error:|What went wrong|Execution failed|FAILED|Could not " build.log 2>/dev/null | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: vayora-mdm-agent
          path: out/vayora-mdm-agent.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
