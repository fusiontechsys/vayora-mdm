
name: Build Vayora MDM Agent APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false

      - name: Verify required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK_ROOT"

          test -d "$SDK_ROOT/platforms/android-34" || {
            echo "ERROR: Android SDK platform 34 is missing."
            ls -1 "$SDK_ROOT/platforms" 2>/dev/null || true
            exit 1
          }

          test -d "$SDK_ROOT/build-tools/34.0.0" || {
            echo "ERROR: Android Build Tools 34.0.0 are missing."
            ls -1 "$SDK_ROOT/build-tools" 2>/dev/null || true
            exit 1
          }

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract fixed Android source archive
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*mdm-agent-android-fixed.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: Fixed Android source ZIP not found."
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -printf '%f\n'
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/android-source"
          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/android-source"

          PROJECT_DIR="$GITHUB_WORKSPACE/android-source/vayora-mdm-agent-android"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Expected Gradle project files are missing."
            find "$GITHUB_WORKSPACE/android-source" -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Confirmed project: $PROJECT_DIR"

      - name: Restore release signing key if configured
        env:
          KEYSTORE_B64: ${{ secrets.VAYORA_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.VAYORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.VAYORA_KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.VAYORA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$KEYSTORE_B64" && -z "$KEYSTORE_PASSWORD_SECRET" && -z "$KEY_ALIAS_SECRET" && -z "$KEY_PASSWORD_SECRET" ]]; then
            echo "No signing secrets configured; building debug APK."
            echo "BUILD_TASK=assembleDebug" >> "$GITHUB_ENV"
            exit 0
          fi

          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD_SECRET" || -z "$KEY_ALIAS_SECRET" || -z "$KEY_PASSWORD_SECRET" ]]; then
            echo "ERROR: All four signing secrets must be configured."
            exit 1
          fi

          KEYSTORE_FILE="$RUNNER_TEMP/vayora-release.jks"

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"

          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD_SECRET" \
            -alias "$KEY_ALIAS_SECRET" >/dev/null

          {
            echo "KEYSTORE_PATH=$KEYSTORE_FILE"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET"
            echo "KEY_ALIAS=$KEY_ALIAS_SECRET"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET"
            echo "BUILD_TASK=assembleRelease"
          } >> "$GITHUB_ENV"

          echo "Release signing key validated."

      - name: Build APK
        shell: bash
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle --no-daemon \
            --console=plain \
            --stacktrace \
            "$BUILD_TASK" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/out"

          if [ "$BUILD_TASK" = "assembleRelease" ]; then
            APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          else
            APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          fi

          if [ ! -f "$APK" ]; then
            echo "ERROR: Expected APK not found."
            find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' || true
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/out/vayora-mdm-agent.apk"
          sha256sum "$GITHUB_WORKSPACE/out/vayora-mdm-agent.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vayora-mdm-agent
          path: out/vayora-mdm-agent.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vayora-mdm-agent-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
