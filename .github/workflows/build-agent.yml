
name: Build Vayora MDM Agent APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "Using: $SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses \
            >/dev/null 2>&1 || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          test -d "$SDK_ROOT/platforms/android-34"
          test -d "$SDK_ROOT/build-tools/34.0.0"

          echo "Android SDK configured successfully."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/vayora-mdm-agent-android-fixed.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Fixed Android ZIP not found."
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/android-source"

          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/android-source"

          PROJECT_DIR="$GITHUB_WORKSPACE/android-source/vayora-mdm-agent-android"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found."
            find "$GITHUB_WORKSPACE/android-source" -maxdepth 4 -type f
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project extracted successfully."

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VAYORA_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.VAYORA_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.VAYORA_KEY_ALIAS }}
          K_PASS: ${{ secrets.VAYORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$KEYSTORE_B64" && \
                -z "$KS_PASS" && \
                -z "$KS_ALIAS" && \
                -z "$K_PASS" ]]; then
            echo "BUILD_TASK=assembleDebug" >> "$GITHUB_ENV"
            echo "No signing secrets found. Building debug APK."
            exit 0
          fi

          if [[ -z "$KEYSTORE_B64" || \
                -z "$KS_PASS" || \
                -z "$KS_ALIAS" || \
                -z "$K_PASS" ]]; then
            echo "ERROR: One or more signing secrets are missing."
            exit 1
          fi

          KEYSTORE_FILE="$RUNNER_TEMP/vayora-release.jks"

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KS_PASS" \
            -alias "$KS_ALIAS" >/dev/null

          {
            echo "KEYSTORE_PATH=$KEYSTORE_FILE"
            echo "KEYSTORE_PASSWORD=$KS_PASS"
            echo "KEY_ALIAS=$KS_ALIAS"
            echo "KEY_PASSWORD=$K_PASS"
            echo "BUILD_TASK=assembleRelease"
          } >> "$GITHUB_ENV"

          echo "Release signing configured."

      - name: Build Android APK
        shell: bash
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle --no-daemon \
            --console=plain \
            --stacktrace \
            "$BUILD_TASK" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify and collect APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/out"

          if [ "$BUILD_TASK" = "assembleRelease" ]; then
            APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          else
            APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          fi

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find "$PROJECT_DIR/app/build/outputs/apk" \
              -type f -name "*.apk" || true
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/out/vayora-mdm-agent.apk"

          echo "APK generated successfully."
          sha256sum "$GITHUB_WORKSPACE/out/vayora-mdm-agent.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vayora-mdm-agent
          path: out/vayora-mdm-agent.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vayora-mdm-agent-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
