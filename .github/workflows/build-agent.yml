
name: Build Vayora MDM Agent APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "*.gradle"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-agent.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.VAYORA_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.VAYORA_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.VAYORA_KEY_ALIAS }}
          K_PASS: ${{ secrets.VAYORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_B64" ] || \
             [ -z "$KS_PASS" ] || \
             [ -z "$KS_ALIAS" ] || \
             [ -z "$K_PASS" ]; then
            echo "ERROR: Android signing secrets are missing."
            exit 1
          fi

          echo "$KEYSTORE_B64" | base64 --decode \
            > "$RUNNER_TEMP/vayora-release.jks"

          test -s "$RUNNER_TEMP/vayora-release.jks"

          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/vayora-release.jks"
            echo "KEYSTORE_PASSWORD=$KS_PASS"
            echo "KEY_ALIAS=$KS_ALIAS"
            echo "KEY_PASSWORD=$K_PASS"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail

          gradle --no-daemon --console=plain \
            --stacktrace assembleRelease

      - name: Verify APK
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not found."
            find app/build/outputs/apk -type f -name "*.apk" || true
            exit 1
          fi

          mkdir -p out
          cp "$APK" out/vayora-mdm-agent.apk

          echo "APK successfully created."
          sha256sum out/vayora-mdm-agent.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vayora-mdm-agent
          path: out/vayora-mdm-agent.apk
          if-no-files-found: error
          retention-days: 30
