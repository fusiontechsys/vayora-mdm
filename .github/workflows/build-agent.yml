
name: Build Vayora MDM Agent APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP=""

          for FILE in ./*mdm-agent-android-fixed.zip; do
            if [ -f "$FILE" ]; then
              ZIP="$FILE"
              break
            fi
          done

          if [ -z "$ZIP" ]; then
            for FILE in ./*mdm-agent-android.zip; do
              if [ -f "$FILE" ]; then
                ZIP="$FILE"
                break
              fi
            done
          fi

          if [ -z "$ZIP" ]; then
            echo "ERROR: Android source ZIP not found."
            ls -la
            exit 1
          fi

          echo "Extracting: $ZIP"

          mkdir -p android-source
          unzip -q "$ZIP" -d android-source

          SETTINGS=$(find android-source \
            -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: ZIP does not contain a Gradle settings file."
            find android-source -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found: $PROJECT_DIR"

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.VAYORA_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.VAYORA_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.VAYORA_KEY_ALIAS }}
          K_PASS: ${{ secrets.VAYORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_B64" ] || \
             [ -z "$KS_PASS" ] || \
             [ -z "$KS_ALIAS" ] || \
             [ -z "$K_PASS" ]; then
            echo "ERROR: Signing secrets are missing."
            exit 1
          fi

          echo "$KEYSTORE_B64" | base64 --decode \
            > "$RUNNER_TEMP/vayora-release.jks"

          test -s "$RUNNER_TEMP/vayora-release.jks"

          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/vayora-release.jks"
            echo "KEYSTORE_PASSWORD=$KS_PASS"
            echo "KEY_ALIAS=$KS_ALIAS"
            echo "KEY_PASSWORD=$K_PASS"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail

          gradle -p "$PROJECT_DIR" \
            --no-daemon \
            --console=plain \
            --stacktrace \
            assembleRelease

      - name: Collect APK
        run: |
          set -euo pipefail

          mkdir -p out

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."
            find "$PROJECT_DIR" -type f -name "*.apk" || true
            exit 1
          fi

          cp "$APK" out/vayora-mdm-agent.apk

          sha256sum out/vayora-mdm-agent.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vayora-mdm-agent
          path: out/vayora-mdm-agent.apk
          if-no-files-found: error
          retention-days: 30
