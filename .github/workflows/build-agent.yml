
name: Build Vayora MDM Agent APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "*.gradle"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-agent.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 14742923
          accept-android-sdk-licenses: false
          packages: ""

      - name: Verify Android SDK
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "Android SDK: $SDK"

          if [ ! -d "$SDK/platforms/android-34" ]; then
            echo "ERROR: Android API 34 is not installed."
            ls "$SDK/platforms" || true
            exit 1
          fi

          if [ ! -d "$SDK/build-tools/34.0.0" ]; then
            echo "ERROR: Build Tools 34.0.0 are not installed."
            ls "$SDK/build-tools" || true
            exit 1
          fi

          echo "Android SDK verification successful."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.VAYORA_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.VAYORA_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.VAYORA_KEY_ALIAS }}
          K_PASS: ${{ secrets.VAYORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_B64" ] || \
             [ -z "$KS_PASS" ] || \
             [ -z "$KS_ALIAS" ] || \
             [ -z "$K_PASS" ]; then
            echo "ERROR: Required signing secrets are missing."
            exit 1
          fi

          echo "$KEYSTORE_B64" | base64 --decode \
            > "$RUNNER_TEMP/vayora-release.jks"

          test -s "$RUNNER_TEMP/vayora-release.jks"

          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/vayora-release.jks"
            echo "KEYSTORE_PASSWORD=$KS_PASS"
            echo "KEY_ALIAS=$KS_ALIAS"
            echo "KEY_PASSWORD=$K_PASS"
          } >> "$GITHUB_ENV"

          echo "Signing keystore restored."

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail

          gradle --no-daemon --console=plain \
            --stacktrace assembleRelease

      - name: Collect APK
        run: |
          set -euo pipefail

          mkdir -p out

          APK=$(find app/build/outputs/apk/release \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          cp "$APK" out/vayora-mdm-agent.apk

          sha256sum out/vayora-mdm-agent.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vayora-mdm-agent
          path: out/vayora-mdm-agent.apk
          if-no-files-found: error
          retention-days: 30
