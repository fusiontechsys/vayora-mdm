# Vayora MDM Agent - signed release APK.
# NOTE: keep this file name. The version code is github.run_number, which restarts from 1 if the
# workflow is renamed or recreated, and an upgrade with a lower version code is refused by Android.
name: Build Vayora MDM Agent APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/app/**"
      - "**/*.kts"
      - "**/gradle.properties"
      - ".github/workflows/build-agent.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Locate the Gradle project and check required files
        run: |
          set -euo pipefail
          FOUND=$(find . -name "settings.gradle*" -not -path "*/build/*" -not -path "./.git/*" | head -n1 || true)
          if [ -z "$FOUND" ]; then
            echo "::error::No settings.gradle or settings.gradle.kts exists anywhere in this repository. Upload the project files so settings.gradle.kts is in the repository."
            echo "Repository contents:"
            find . -path ./.git -prune -o -print | head -300
            exit 1
          fi
          PROJECT_DIR=$(dirname "$FOUND")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project found in: $PROJECT_DIR"

          MISSING=0
          for f in settings.gradle.kts build.gradle.kts gradle.properties app/build.gradle.kts app/src/main/AndroidManifest.xml; do
            if [ ! -f "$PROJECT_DIR/$f" ] && [ ! -f "$PROJECT_DIR/${f%.kts}" ]; then
              echo "::error::Missing file in project: $PROJECT_DIR/$f"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "Repository contents:"
            find . -path ./.git -prune -o -print | head -300
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n1 || true)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::No sdkmanager found under $SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          test -x "$SDK/build-tools/34.0.0/apksigner"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Require and restore the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.VAYORA_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.VAYORA_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.VAYORA_KEY_ALIAS }}
          K_PASS: ${{ secrets.VAYORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ] || [ -z "$K_PASS" ]; then
            echo "::error::Release signing secrets are missing. Add VAYORA_KEYSTORE_B64, VAYORA_KEYSTORE_PASSWORD, VAYORA_KEY_ALIAS and VAYORA_KEY_PASSWORD."
            exit 1
          fi
          KS_FILE="$RUNNER_TEMP/vayora-release.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$KS_FILE"
          keytool -list -keystore "$KS_FILE" -storepass "$KS_PASS" -alias "$KS_ALIAS" > /dev/null
          {
            echo "KEYSTORE_PATH=$KS_FILE"
            echo "KEYSTORE_PASSWORD=$KS_PASS"
            echo "KEY_ALIAS=$KS_ALIAS"
            echo "KEY_PASSWORD=$K_PASS"
          } >> "$GITHUB_ENV"
          echo "Release keystore loaded and verified."

      - name: Build signed release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set +e
          cd "$GITHUB_WORKSPACE/$PROJECT_DIR"
          gradle --no-daemon --console=plain --stacktrace assembleRelease > "$GITHUB_WORKSPACE/build.log" 2>&1
          STATUS=$?
          cat "$GITHUB_WORKSPACE/build.log"
          exit $STATUS

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -f "$APK" || { echo "::error::Expected APK was not produced at $APK"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$GITHUB_WORKSPACE/signature.txt"
          cat "$GITHUB_WORKSPACE/signature.txt"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "$GITHUB_WORKSPACE/signature.txt" || { echo "::error::APK is not v2-signed"; exit 1; }

      - name: Collect APK and checksums
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$GITHUB_WORKSPACE/$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" "$GITHUB_WORKSPACE/out/vayora-mdm-agent.apk"
          CERT=$(grep -m1 "certificate SHA-256 digest" "$GITHUB_WORKSPACE/signature.txt" | sed 's/.*digest: //')
          {
            echo "## Vayora MDM Agent build #${{ github.run_number }} (signed release)"
            echo "Signing certificate SHA-256: \`$CERT\`"
            echo "APK SHA-256: \`$(sha256sum "$GITHUB_WORKSPACE/out/vayora-mdm-agent.apk" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show the real build error in the run summary
        if: failure()
        run: |
          {
            echo "## Build failed - the real error"
            echo '```'
            if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
              grep -A 15 -E "What went wrong|^e: " "$GITHUB_WORKSPACE/build.log" | head -80 || true
            else
              echo "No build.log was produced; the failure happened before Gradle ran. See the earlier step logs."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: vayora-mdm-agent
          path: out/vayora-mdm-agent.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
