
name: Build Vayora MDM Agent APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.kts"
      - "gradle.properties"
      - ".github/workflows/build-agent.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.VAYORA_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.VAYORA_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.VAYORA_KEY_ALIAS }}
          K_PASS: ${{ secrets.VAYORA_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vayora.jks"
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/vayora.jks"
            echo "KEYSTORE_PASSWORD=$KS_PASS"
            echo "KEY_ALIAS=$KS_ALIAS"
            echo "KEY_PASSWORD=$K_PASS"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          gradle --no-daemon --console=plain assembleRelease

      - name: Prepare APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk \
            out/vayora-mdm-agent.apk
          sha256sum out/vayora-mdm-agent.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vayora-mdm-agent
          path: out/vayora-mdm-agent.apk
          retention-days: 30
