
name: Build Vayora MDM Agent APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 14742923
          accept-android-sdk-licenses: false
          packages: ""

      - name: Verify Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK: $SDK"
          ls "$SDK/platforms"
          ls "$SDK/build-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find . \
            -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file not found."
            find . -maxdepth 5 -type f | head -150
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project: $PROJECT_DIR"

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.VAYORA_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.VAYORA_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.VAYORA_KEY_ALIAS }}
          K_PASS: ${{ secrets.VAYORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_B64" ] || \
             [ -z "$KS_PASS" ] || \
             [ -z "$KS_ALIAS" ] || \
             [ -z "$K_PASS" ]; then
            echo "ERROR: Required signing secrets are missing."
            exit 1
          fi

          echo "$KEYSTORE_B64" | base64 --decode \
            > "$RUNNER_TEMP/vayora-release.jks"

          test -s "$RUNNER_TEMP/vayora-release.jks"

          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/vayora-release.jks"
            echo "KEYSTORE_PASSWORD=$KS_PASS"
            echo "KEY_ALIAS=$KS_ALIAS"
            echo "KEY_PASSWORD=$K_PASS"
          } >> "$GITHUB_ENV"

          echo "Keystore restored."

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail

          gradle -p "$PROJECT_DIR" \
            --no-daemon \
            --console=plain \
            --stacktrace \
            assembleRelease

      - name: Find and verify APK
        run: |
          set -euo pipefail

          mkdir -p out

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            find "$PROJECT_DIR" -type f -name "*.apk" || true
            exit 1
          fi

          cp "$APK" out/vayora-mdm-agent.apk

          echo "APK created successfully."
          sha256sum out/vayora-mdm-agent.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vayora-mdm-agent
          path: out/vayora-mdm-agent.apk
          if-no-files-found: error
          retention-days: 30
